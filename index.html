
<!DOCTYPE html>
<html>
<head>
    <title>Aadil's Online Shopping Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #172554;
            color: white;
            text-align: center;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 30px;
        }

        .product {
            background-color: white;
            width: 250px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 8px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            background-color: #172554;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Aadil's Online Shopping Store</h1>
        <p>Welcome! Shop your favourite products here.</p>
    </header>

    <div class="container">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones">
            <h2>Wireless Headphones</h2>
            <p class="price">₹1,499</p>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Watch">
            <h2>Smart Watch</h2>
            <p class="price">₹2,499</p>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Shoes">
            <h2>Sports Shoes</h2>
            <p class="price">₹1,999</p>
        </div>

    </div>

    <footer>
        <p>© 2026 Aadil's Online Shopping Store</p>
    </footer>

</body>
</html>
